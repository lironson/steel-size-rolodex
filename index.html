<style>
:root {
  --bg: #ffffff;
  --ink: #0b0b0b;
  --muted: #767676;
  --faint: #e6e6e6;
  --accent: #ff4f00;
  --on-accent: #ffffff;
  --banana: #f4cf3a;
  --banana-edge: #a8820f;
  --banana-stem: #5b4320;
  --row-h: 52px;
  --f-display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --ink: #f2f2f2; --muted: #8a8a8a; --faint: #262626;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --ink: #f2f2f2; --muted: #8a8a8a; --faint: #262626;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.4 var(--f-body);
  padding-inline: 16px;
}
.app {
  height: 100%;
  max-width: 1080px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr) auto;
  column-gap: 40px;
  row-gap: 16px;
  padding-block: 20px;
}
header { grid-column: 1 / -1; display: flex; align-items: center; gap: 18px; }

.brand-rule { flex: none; width: 1px; align-self: stretch; background: var(--faint); }
header .count { margin-left: auto; white-space: nowrap; }
h1 {
  font: 700 24px/1 var(--f-display);
  letter-spacing: 0.04em;
  text-transform: uppercase;
  margin: 0;
}
h1 i { font-style: normal; color: var(--accent); }
.count { font: 500 12px var(--f-mono); color: var(--muted); }

.left, .right { display: flex; flex-direction: column; gap: 14px; min-height: 0; }

form { display: flex; gap: 8px; }
#q {
  flex: 1; min-width: 0;
  font: 600 22px var(--f-mono);
  text-transform: uppercase;
  padding: 10px 2px;
  border: 0;
  border-bottom: 2px solid var(--ink);
  border-radius: 0;
  background: transparent;
  color: var(--ink);
}
#q:focus { outline: none; border-bottom-color: var(--accent); }
#q::placeholder { text-transform: none; font-weight: 400; font-size: 18px; color: var(--muted); opacity: 1; }
button {
  font: 700 15px var(--f-display);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 0 20px;
  border: 0; border-radius: 0;
  background: var(--ink); color: var(--bg);
  cursor: pointer;
}
button:hover { background: var(--accent); color: var(--on-accent); }
button:focus-visible, .row:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#status { min-height: 20px; color: var(--muted); }
#status b { font-family: var(--f-mono); color: var(--ink); font-weight: 600; }
#status.err { color: var(--accent); }

.cols, .row {
  display: grid;
  grid-template-columns: 52px 1fr 1fr;
  align-items: center;
  gap: 10px;
  padding-inline: 4px;
}
.cols, .label {
  font: 600 12px var(--f-display);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
}

.wheel-wrap {
  position: relative;
  flex: 1;
  min-height: 300px;
  border-block: 1px solid var(--faint);
  overflow: hidden;
}
.band {
  position: absolute; left: 0; right: 0;
  top: calc(50% - var(--row-h) / 2);
  height: var(--row-h);
  border-block: 2px solid var(--accent);
  pointer-events: none;
}
.wheel-wrap::before, .wheel-wrap::after {
  content: ""; position: absolute; left: 0; right: 0; height: 30%;
  pointer-events: none; z-index: 2;
}
.wheel-wrap::before { top: 0; background: linear-gradient(var(--bg), transparent); }
.wheel-wrap::after { bottom: 0; background: linear-gradient(transparent, var(--bg)); }
#wheel {
  position: absolute; inset: 0;
  overflow-y: auto;
  scroll-snap-type: y mandatory;
  perspective: 700px;
  scrollbar-width: none;
}
#wheel::-webkit-scrollbar { display: none; }
.pad { height: calc(50% - var(--row-h) / 2); }
.row {
  height: var(--row-h);
  scroll-snap-align: center;
  cursor: pointer;
  transform-origin: center;
  will-change: transform, opacity;
  font-variant-numeric: tabular-nums;
}
.t { font: 600 12px var(--f-mono); color: var(--muted); }
.m, .i { font: 500 18px var(--f-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.i { color: var(--muted); }
.row.sel .m, .row.sel .i { color: var(--ink); font-weight: 600; }
.row.sel .t { color: var(--accent); }

.props {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin: 0;
  padding-top: 12px;
  border-top: 1px solid var(--faint);
}
.props dd, .dims dd { margin: 2px 0 0; font: 500 15px var(--f-mono); font-variant-numeric: tabular-nums; }
.hint { font-size: 12px; color: var(--muted); margin: 0; }

/* footer + banana switch */
.foot {
  grid-column: 1 / -1;
  display: flex; align-items: center; gap: 12px;
  border-top: 1px solid var(--faint);
  padding-top: 12px;
}
.switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.track {
  position: relative; width: 38px; height: 22px; flex: none;
  border: 1.5px solid var(--ink); border-radius: 11px;
  transition: background .15s, border-color .15s;
}
.knob {
  position: absolute; top: 3px; left: 3px; width: 13px; height: 13px;
  border-radius: 50%; background: var(--ink);
  transition: transform .15s, background .15s;
}
.switch input:checked + .track { background: var(--accent); border-color: var(--accent); }
.switch input:checked + .track .knob { transform: translateX(16px); background: var(--on-accent); }
.switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
.switch-label { font: 600 13px var(--f-display); letter-spacing: 0.12em; text-transform: uppercase; }
@media (prefers-reduced-motion: reduce) { .track, .knob { transition: none; } }
#fig .banana { fill: var(--banana); stroke: var(--banana-edge); stroke-width: 1; }
#fig .banana-ridge { fill: none; stroke: var(--banana-edge); stroke-width: 1; opacity: .55; }
#fig .banana-stem { fill: var(--banana-stem); }
kbd { font: 500 11px var(--f-mono); border: 1px solid var(--faint); padding: 0 4px; }

/* section diagram */
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.sec-title { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; min-width: 0; }
#sec-name { font: 600 28px/1.1 var(--f-mono); }
#sec-alt { font-size: 15px; }
#sec-alt { font: 500 14px var(--f-mono); color: var(--muted); }
.units { display: inline-flex; border: 1.5px solid var(--ink); }
.units button {
  padding: 5px 12px;
  font-size: 12px;
  background: transparent; color: var(--ink);
}
.units button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.units button:hover { background: var(--accent); color: var(--on-accent); }
.fig { flex: 1; min-height: 280px; position: relative; }
#fig { position: absolute; inset: 0; width: 100%; height: 100%; }
#fig .steel { fill: var(--ink); }
#fig .cl { stroke: var(--muted); stroke-width: 0.8; stroke-dasharray: 14 4 2 4; fill: none; }
#fig .dim { stroke: var(--accent); stroke-width: 1.2; fill: none; }
#fig .ext { stroke: var(--muted); stroke-width: 0.6; fill: none; }
#fig .arrow { fill: var(--accent); }
#fig text { fill: var(--ink); font: 500 13px var(--f-mono); paint-order: stroke; stroke: var(--bg); stroke-width: 5px; stroke-linejoin: round; }
#fig text.ax { fill: var(--muted); font: 600 12px var(--f-display); letter-spacing: 0.1em; }
#fig text.none { fill: var(--muted); font: 500 14px var(--f-body); }
.dims {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin: 0;
}
.dims dt b { text-transform: none; color: var(--ink); font-family: var(--f-mono); letter-spacing: 0; margin-right: 4px; }

/* short screens (phones in landscape): let the page scroll instead of squeezing
   the wheel and drawing into one screen, where they would overflow the footer */
@media (max-height: 640px) {
  .app { height: auto; grid-template-rows: auto auto auto; }
  .wheel-wrap { flex: none; height: 300px; }
  .fig { flex: none; height: 300px; }
}
@media (max-width: 820px) {
  .app { display: flex; flex-direction: column; height: auto; }
  .wheel-wrap { flex: none; height: 360px; }
  .fig { flex: none; height: 320px; }
  /* one column: search, then the diagram and dimensions, then the rolodex */
  .left, .right { display: contents; }
  form { order: 1; }
  #status { order: 2; }
  .right > * { order: 3; }
  .cols { order: 4; margin-top: 12px; }
  .wheel-wrap { order: 5; }
  .left > .hint { order: 6; }
  .foot { order: 7; }
}
@media (max-width: 480px) {
  .logo { width: 95px; height: 48px; }
  header .count { display: none; }
  header { gap: 12px; }
  h1 { font-size: 20px; }
  .props { grid-template-columns: repeat(2, 1fr); }
  .units button { padding: 5px 10px; }
  #sec-name { font-size: 24px; }
  #fig text { font-size: 12px; }
  .dims { grid-template-columns: repeat(2, 1fr); }
  .m, .i { font-size: 16px; }
  .cols, .row { grid-template-columns: 40px 1fr 1fr; }
}
</style>
</head>

<div class="app">
  <header>

  <section class="left">

      </div>
      <div class="units" role="group" aria-label="Dimension units">

        <button type="button" id="u-mm" data-u="mm" aria-pressed="false">Metric</button>

    </div>
    <div class="fig"><svg id="fig" role="img" aria-label="Cross-section with dimensions"></svg></div>
    <dl class="dims" id="dims"></dl>
    <dl class="props">
      <div><dt class="label">Weight</dt><dd id="d-wt">–</dd></div>
      <div><dt class="label">Perimeter</dt><dd id="d-per">–</dd></div>
    </dl>
    <p class="hint">From AISC Shapes Database v16. Metric dimensions are converted from inches.</p>
  </section>

  <footer class="foot">
    <label class="switch" for="banana">
      <input type="checkbox" id="banana" role="switch">
      <span class="track" aria-hidden="true"><span class="knob"></span></span>
      <span class="switch-label">Banana for scale</span>
    </label>
  </footer>
</div>

// ---------- parsing ----------
const TYPES = ['PIPE', 'HSS', 'WT', 'MC', 'HP', 'W', 'M', 'S', 'C', 'L'];

function toNum(s) {
  // handles 12.7, 3/4, 1-3/8
  let m = s.match(/^(\d+)-(\d+)\/(\d+)$/);
  if (m) return +m[1] + m[2] / m[3];
  m = s.match(/^(\d*\.?\d+)\/(\d+)$/);
  if (m) return m[1] / m[2];
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}

function normalize(s) {
  return s.toUpperCase().trim()
    .replace(/\s*[X×*]\s*/g, 'X')
    .replace(/(\d)\s+(?=\d)/g, '$1X')
    .replace(/\s+/g, '');
}

// "W310X28" -> {type:'W', nums:[310,28], sched:''}
function parse(label) {
  const s = normalize(label);
  const type = TYPES.find(t => s.startsWith(t)) || '';
  let rest = s.slice(type.length);
  let sched = '';
  if (type === 'PIPE') {
    const m = rest.match(/^([\d.\/-]+)(.*)$/);
    if (!m) return { type, nums: [], sched: rest };
    rest = m[1]; sched = m[2];
  }
  const nums = rest.split('X').filter(Boolean).map(toNum);
  if (nums.some(n => n === null)) return null;
  return { type, nums, sched };
}

const PARSED = DATA.map(r => ({ m: parse(r[1]), i: r[2] ? parse(r[2]) : null }));

function score(a, b) {
  if (!b || b.nums.length < a.nums.length) return Infinity;
  if (a.type && a.type !== b.type) return Infinity;
  let s = 0;
  a.nums.forEach((v, k) => {
    const w = b.nums[k];
    s += (k === 0 ? 3 : 1) * Math.abs(v - w) / Math.max(Math.abs(v), Math.abs(w), 1e-9);
  });
  if (b.nums.length !== a.nums.length) s += 0.001;       // prefer full-length matches
  if (a.sched && a.sched !== b.sched) s += 0.5;           // pipe schedule mismatch
  return s;
}

function findClosest(input) {
  const a = parse(input);
  if (!a || !a.nums.length) return null;
  let best = { idx: -1, s: Infinity, sys: '' };
  PARSED.forEach((p, idx) => {
    const sm = score(a, p.m), si = score(a, p.i);
    if (sm < best.s) best = { idx, s: sm, sys: 'metric' };
    if (si < best.s) best = { idx, s: si, sys: 'imperial' };
  });
  return best.idx < 0 ? null : best;
}

function el(tag, attrs, parent) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  (parent || fig).appendChild(e);
  return e;
}
function text(x, y, str, anchor = 'start', cls = '') {
  const t = el('text', { x, y, 'text-anchor': anchor, 'dominant-baseline': 'middle', class: cls });
  t.textContent = str;
  // keep the label inside the drawing on narrow screens
  const bb = t.getBBox(), W = fig.viewBox.baseVal.width || fig.clientWidth, pad = 4;
  if (bb.width && bb.x < pad) t.setAttribute('x', x + pad - bb.x);
  else if (bb.width && bb.x + bb.width > W - pad) t.setAttribute('x', x - (bb.x + bb.width - (W - pad)));
  return t;
}

// when a small drawing packs callouts together, step later labels down until they clear earlier ones
function declutter() {
  const placed = [];
  for (const t of fig.querySelectorAll('text:not(.ax):not(.none)')) {
    let bb = t.getBBox();
    for (let i = 0; i < 6; i++) {
      const hit = placed.find(p => bb.x < p.x + p.width && p.x < bb.x + bb.width && bb.y < p.y + p.height && p.y < bb.y + bb.height);
      if (!hit) break;
      t.setAttribute('y', +t.getAttribute('y') + (hit.y + hit.height - bb.y) + 2);
      bb = t.getBBox();
    }
    placed.push(bb);
  }
}
function arrowHead(x, y, ang) {
  const s = 7, w = 3;
  const c = Math.cos(ang), n = Math.sin(ang);
  el('path', { class: 'arrow', d: `M${x},${y} L${x - s * c + w * n},${y - s * n - w * c} L${x - s * c - w * n},${y - s * n + w * c}Z` });
}
// dimension line between two points, arrows pointing outward to the points
function dimLine(x1, y1, x2, y2) {
  el('line', { class: 'dim', x1, y1, x2, y2 });
  const a = Math.atan2(y2 - y1, x2 - x1);
  arrowHead(x2, y2, a);
  arrowHead(x1, y1, a + Math.PI);
}
function ext(x1, y1, x2, y2) { el('line', { class: 'ext', x1, y1, x2, y2 }); }
// a thickness callout: two arrows pointing inward at a thin feature, plus a label
function thick(x1, y1, x2, y2, label, lx, ly, anchor) {
  const a = Math.atan2(y2 - y1, x2 - x1), L = 16;
  const c = Math.cos(a), s = Math.sin(a);
  el('line', { class: 'dim', x1: x1 - c * L, y1: y1 - s * L, x2: x1, y2: y1 });
  el('line', { class: 'dim', x1: x2, y1: y2, x2: x2 + c * L, y2: y2 + s * L });
  arrowHead(x1, y1, a);
  arrowHead(x2, y2, a + Math.PI);
  text(lx, ly, label, anchor);
}

// fit a shape of width w by height h (inches) into the drawing box
// a medium banana: 7" long, drawn in a 2.2" x 7" box
const BANANA = { w: 2.2, h: 7 };
let showBanana = false, lastBox = null;

function fitBox(w, h) {
  const W = fig.clientWidth || 480, H = fig.clientHeight || 400;
  fig.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const m = { l: 132, r: 120, t: 34, b: 64 };
  if (!showBanana) {
    const s = Math.min((W - m.l - m.r) / w, (H - m.t - m.b) / h);
    const ox = m.l + (W - m.l - m.r - w * s) / 2;
    const oy = m.t + (H - m.t - m.b - h * s) / 2;
    return (lastBox = { s, ox, oy, W, H });
  }
  // shape, then room for its callouts, then the banana; both stand on one baseline
  // (narrow drawings tighten the callout gap so the shape keeps a usable size)
  const narrow = W < 480, gap = narrow ? 108 : 130, mr = narrow ? 36 : 48, tall = Math.max(h, BANANA.h);
  const s = Math.min((W - m.l - mr - gap) / (w + BANANA.w), (H - m.t - m.b) / tall);
  const ox = m.l + (W - m.l - mr - gap - (w + BANANA.w) * s) / 2;
  const base = m.t + (H - m.t - m.b + tall * s) / 2;
  return (lastBox = { s, ox, oy: base - h * s, W, H,
    banana: { x: ox + w * s + gap, y: base - BANANA.h * s, s } });
}

  el('path', { class: 'banana-ridge', ...ns, d: 'M0.4,0.98 C1.95,2.1 1.85,5.4 0.32,6.86' }, g);
  el('ellipse', { class: 'banana-stem', cx: 0.32, cy: 6.92, rx: 0.1, ry: 0.07 }, g);
  text(x + BANANA.w * s / 2, y + BANANA.h * s + 18, 'banana \u2248 ' + (units === 'mm' ? '178 mm' : '7"'), 'middle');
}

function centerlines(cx, cy, b) {
  el('line', { class: 'cl', x1: 18, y1: cy, x2: b.W - 18, y2: cy });
  el('line', { class: 'cl', x1: cx, y1: 10, x2: cx, y2: b.H - 10 });
  text(b.W - 10, cy - 10, 'X', 'end', 'ax');
  text(cx + 8, 16, 'Y', 'start', 'ax');
}

function drawI(D) {
  const { d, bf, tf, tw, k } = D;
  const b = fitBox(bf, d), s = b.s;
  const X = v => b.ox + (v + bf / 2) * s, Y = v => b.oy + v * s;
  const hw = tw / 2, r = Math.max(0, Math.min(k - tf, bf / 2 - hw, d / 2 - tf)) * s;
  const xL = X(-bf / 2), xR = X(bf / 2), wl = X(-hw), wr = X(hw);
  const y0 = Y(0), y1 = Y(tf), y2 = Y(d - tf), y3 = Y(d);
  centerlines(X(0), Y(d / 2), b);
  el('path', { class: 'steel', d:
    `M${xL},${y0}H${xR}V${y1}H${wr + r}A${r},${r} 0 0 0 ${wr},${y1 + r}V${y2 - r}A${r},${r} 0 0 0 ${wr + r},${y2}` +
    `H${xR}V${y3}H${xL}V${y2}H${wl - r}A${r},${r} 0 0 0 ${wl},${y2 - r}V${y1 + r}A${r},${r} 0 0 0 ${wl - r},${y1}H${xL}Z` });
  // d
  const dx = xL - 36;
  ext(xL - 4, y0, dx - 6, y0); ext(xL - 4, y3, dx - 6, y3);
  dimLine(dx, y0, dx, y3); text(dx - 8, (y0 + y3) / 2, 'd = ' + len(d), 'end');
  // bf
  const by = y3 + 30;
  ext(xL, y3 + 4, xL, by + 6); ext(xR, y3 + 4, xR, by + 6);
  dimLine(xL, by, xR, by); text((xL + xR) / 2, by + 16, 'bf = ' + len(bf), 'middle');
  // tf at right tip of top flange
  thick(xR + 12, y0, xR + 12, y1, 'tf = ' + len(tf), xR + 22, (y0 + y1) / 2, 'start');
  ext(xR + 2, y0, xR + 16, y0); ext(xR + 2, y1, xR + 16, y1);
  // tw across the web, a third of the way down
  const ty = Y(d * 0.36);
  thick(wl, ty, wr, ty, 'tw = ' + len(tw), wr + 22, ty, 'start');
  // k from top of flange to toe of fillet, beside the web
  const kx = wr + r + 12, ky = Y(k);
  ext(wr + 2, ky, kx + 6, ky);
  dimLine(kx, y0, kx, ky);
  text(kx + 10, ky + 10, 'k = ' + len(k), 'start');
}

function drawC(D) {
  const { d, bf, tf, tw, k } = D;
  const b = fitBox(bf, d), s = b.s;
  const X = v => b.ox + v * s, Y = v => b.oy + v * s;
  const r = Math.max(0, Math.min(k - tf, bf - tw, d / 2 - tf)) * s;
  const x0 = X(0), xw = X(tw), xR = X(bf);
  const y0 = Y(0), y1 = Y(tf), y2 = Y(d - tf), y3 = Y(d);
  centerlines(X(D.x ?? bf / 2), Y(d / 2), b);
  el('path', { class: 'steel', d:
    `M${x0},${y0}H${xR}V${y1}H${xw + r}A${r},${r} 0 0 0 ${xw},${y1 + r}V${y2 - r}A${r},${r} 0 0 0 ${xw + r},${y2}H${xR}V${y3}H${x0}Z` });
  const dx = x0 - 36;
  ext(x0 - 4, y0, dx - 6, y0); ext(x0 - 4, y3, dx - 6, y3);
  dimLine(dx, y0, dx, y3); text(dx - 8, (y0 + y3) / 2, 'd = ' + len(d), 'end');
  const by = y3 + 30;
  ext(x0, y3 + 4, x0, by + 6); ext(xR, y3 + 4, xR, by + 6);
  dimLine(x0, by, xR, by); text((x0 + xR) / 2, by + 16, 'bf = ' + len(bf), 'middle');
  thick(xR + 12, y0, xR + 12, y1, 'tf = ' + len(tf), xR + 22, (y0 + y1) / 2, 'start');
  ext(xR + 2, y0, xR + 16, y0); ext(xR + 2, y1, xR + 16, y1);
  const ty = Y(d * 0.62);
  thick(x0, ty, xw, ty, 'tw = ' + len(tw), xw + 22, ty, 'start');
  const kx = xw + r + 12, ky = Y(k);
  ext(xw + 2, ky, kx + 6, ky);
  dimLine(kx, y0, kx, ky);
  text(kx + 10, ky + 10, 'k = ' + len(k), 'start');
}

function drawT(D) {
  const { d, bf, tf, tw, k } = D;
  const b = fitBox(bf, d), s = b.s;
  const X = v => b.ox + (v + bf / 2) * s, Y = v => b.oy + v * s;
  const hw = tw / 2, r = Math.max(0, Math.min(k - tf, bf / 2 - hw, d - tf)) * s;
  const xL = X(-bf / 2), xR = X(bf / 2), wl = X(-hw), wr = X(hw);
  const y0 = Y(0), y1 = Y(tf), y3 = Y(d);
  centerlines(X(0), Y(D.y ?? d / 2), b);
  el('path', { class: 'steel', d:
    `M${xL},${y0}H${xR}V${y1}H${wr + r}A${r},${r} 0 0 0 ${wr},${y1 + r}V${y3}H${wl}V${y1 + r}A${r},${r} 0 0 0 ${wl - r},${y1}H${xL}Z` });
  const dx = xL - 36;
  ext(xL - 4, y0, dx - 6, y0); ext(wl - 4, y3, dx - 6, y3);
  dimLine(dx, y0, dx, y3); text(dx - 8, (y0 + y3) / 2, 'd = ' + len(d), 'end');
  const by = y0 - 18;
  ext(xL, y0 - 4, xL, by - 6); ext(xR, y0 - 4, xR, by - 6);
  dimLine(xL, by, xR, by); text(xR + 8, by, 'bf = ' + len(bf), 'start');
  thick(xR + 12, y0, xR + 12, y1, 'tf = ' + len(tf), xR + 22, (y0 + y1) / 2 + 4, 'start');
  ext(xR + 2, y0, xR + 16, y0); ext(xR + 2, y1, xR + 16, y1);
  const ty = Y(tf + (d - tf) * 0.7);
  thick(wl, ty, wr, ty, 'tw = ' + len(tw), wr + 22, ty, 'start');
  const kx = wr + r + 12, ky = Y(k);
  ext(wr + 2, ky, kx + 6, ky);
  dimLine(kx, y0, kx, ky);
  text(kx + 10, ky + 10, 'k = ' + len(k), 'start');
}

function drawL(D) {
  const { d, b: bw, t, k } = D;
  const b = fitBox(bw, d), s = b.s;
  const X = v => b.ox + v * s, Y = v => b.oy + v * s;
  const r = Math.max(0, Math.min(k - t, bw - t, d - t)) * s;
  const x0 = X(0), xt = X(t), xR = X(bw), y0 = Y(0), yt = Y(d - t), y3 = Y(d);
  if (D.x != null && D.y != null) centerlines(X(D.x), Y(d - D.y), b);
  el('path', { class: 'steel', d: `M${x0},${y0}H${xt}V${yt - r}A${r},${r} 0 0 0 ${xt + r},${yt}H${xR}V${y3}H${x0}Z` });
  const dx = x0 - 36;
  ext(x0 - 4, y0, dx - 6, y0); ext(x0 - 4, y3, dx - 6, y3);
  dimLine(dx, y0, dx, y3); text(dx - 8, (y0 + y3) / 2, 'd = ' + len(d), 'end');
  const by = y3 + 30;
  ext(x0, y3 + 4, x0, by + 6); ext(xR, y3 + 4, xR, by + 6);
  dimLine(x0, by, xR, by); text((x0 + xR) / 2, by + 16, 'b = ' + len(bw), 'middle');
  const ty = Y(d * 0.25);
  thick(x0, ty, xt, ty, 't = ' + len(t), xt + 22, ty, 'start');
  const kx = X(k), ky = yt - r - 14;
  ext(kx, yt - 2, kx, ky - 6);
  dimLine(x0, ky, kx, ky);
  text(kx + 8, ky - 4, 'k = ' + len(k), 'start');
}

function drawR(D) {
  const { h, b: bw, t } = D;
  const b = fitBox(bw, h), s = b.s;
  const x0 = b.ox, y0 = b.oy, W = bw * s, H = h * s, ts = Math.max(t * s, 1.5);
  const ro = Math.min(2 * t * s, W / 2, H / 2), ri = Math.max(0, ro - ts);
  centerlines(x0 + W / 2, y0 + H / 2, b);
  el('path', { class: 'steel', 'fill-rule': 'evenodd', d:
    roundRect(x0, y0, W, H, ro) + roundRect(x0 + ts, y0 + ts, W - 2 * ts, H - 2 * ts, ri) });
  const dx = x0 - 36;
  ext(x0 - 4, y0, dx - 6, y0); ext(x0 - 4, y0 + H, dx - 6, y0 + H);
  dimLine(dx, y0, dx, y0 + H); text(dx - 8, y0 + H / 2, 'h = ' + len(h), 'end');
  const by = y0 + H + 30;
  ext(x0, y0 + H + 4, x0, by + 6); ext(x0 + W, y0 + H + 4, x0 + W, by + 6);
  dimLine(x0, by, x0 + W, by); text(x0 + W / 2, by + 16, 'b = ' + len(bw), 'middle');
  const ty = y0 + H * 0.3;
  thick(x0 + W - ts, ty, x0 + W, ty, 't = ' + len(D.tn ?? t), x0 + W + 22, ty, 'start');
}

function roundRect(x, y, w, h, r) {
  return `M${x + r},${y}H${x + w - r}A${r},${r} 0 0 1 ${x + w},${y + r}V${y + h - r}A${r},${r} 0 0 1 ${x + w - r},${y + h}` +
         `H${x + r}A${r},${r} 0 0 1 ${x},${y + h - r}V${y + r}A${r},${r} 0 0 1 ${x + r},${y}Z`;
}

function drawO(D) {
  const { od, t } = D;
  const b = fitBox(od, od), s = b.s;
  const R = od * s / 2, cx = b.ox + R, cy = b.oy + R, ts = Math.max(t * s, 1.5);
  centerlines(cx, cy, b);
  el('path', { class: 'steel', 'fill-rule': 'evenodd', d:
    `M${cx - R},${cy}a${R},${R} 0 1 0 ${2 * R},0a${R},${R} 0 1 0 ${-2 * R},0Z` +
    `M${cx - R + ts},${cy}a${R - ts},${R - ts} 0 1 0 ${2 * (R - ts)},0a${R - ts},${R - ts} 0 1 0 ${-2 * (R - ts)},0Z` });
  const by = cy + R + 30;
  ext(cx - R, cy + 4, cx - R, by + 6); ext(cx + R, cy + 4, cx + R, by + 6);
  dimLine(cx - R, by, cx + R, by); text(cx, by + 16, 'OD = ' + len(od), 'middle');
  const a = -Math.PI / 4, c = Math.cos(a), n = Math.sin(a);
  thick(cx + (R - ts) * c, cy + (R - ts) * n, cx + R * c, cy + R * n, 't = ' + len(D.tn ?? t),
        cx + R * c + 22, cy + R * n - 14, 'start');
}

const DRAW = { I: drawI, C: drawC, T: drawT, L: drawL, R: drawR, O: drawO };

function renderSection(idx) {
  const [, metric, imperial, , , D] = DATA[idx];
  // lead with the designation in the chosen units; the other one sits beside it
  const [main, alt] = units === 'mm' || !imperial ? [metric, imperial] : [imperial, metric];
  document.getElementById('sec-name').textContent = main;
  document.getElementById('sec-alt').textContent = alt || '';
  const [, , , kgm, pmm] = DATA[idx];
  const fmt = (n, d) => n == null ? '–' : n.toLocaleString(undefined, { maximumFractionDigits: d });
  document.getElementById('d-wt').textContent =
    units === 'mm' ? fmt(kgm, 2) + ' kg/m' : fmt(kgm * 0.671969, 2) + ' lb/ft';
  document.getElementById('d-per').textContent =
    units === 'mm' ? fmt(pmm, 0) + ' mm' : fmt(pmm / 25.4, 2) + ' in';
  fig.replaceChildren();
  const dims = document.getElementById('dims');
  dims.replaceChildren();
  if (!D) {
    fitBox(1, 1);
    text(fig.clientWidth / 2 || 240, fig.clientHeight / 2 || 200, 'No dimension data for this size', 'middle', 'none');
    return;
  }
  DRAW[D.f](D);
  if (showBanana && lastBox.banana) drawBanana(lastBox.banana);
  declutter();
  const vals = { ...D };
  if (D.f === 'O') vals.id = D.od - 2 * D.t;
  for (const [key, name] of LABELS[D.f]) {
    if (vals[key] == null) continue;
    const box = document.createElement('div');
    box.innerHTML = `<dt class="label"><b>${key}</b>${name}</dt><dd>${len(vals[key])}</dd>`;
    dims.appendChild(box);
  }
}

// ---------- wheel ----------
function build() {
  const frag = document.createDocumentFragment();
  const top = document.createElement('div'); top.className = 'pad';
  frag.appendChild(top);
  DATA.forEach((r, i) => {
    const el = document.createElement('div');
    el.className = 'row';
    el.dataset.i = i;
    el.innerHTML = `<span class="t">${r[0]}</span><span class="m">${r[1]}</span><span class="i">${r[2] || '—'}</span>`;
    frag.appendChild(el);
  });
  const bot = document.createElement('div'); bot.className = 'pad';
  frag.appendChild(bot);
  wheel.appendChild(frag);
  rows = [...wheel.querySelectorAll('.row')];
  rowH = rows[0].offsetHeight;
}

function paint() {
  const st = wheel.scrollTop, h = wheel.clientHeight;
  const first = Math.max(0, Math.floor((st - h / 2) / rowH) - 2);
  const last = Math.min(rows.length - 1, Math.ceil((st + h / 2) / rowH) + 2);
  const center = st / rowH;
  for (let i = first; i <= last; i++) {
    const d = i - center;
    const ad = Math.min(Math.abs(d), 7);
    rows[i].style.transform = `rotateX(${(-d * 11).toFixed(1)}deg) scale(${(1 - ad * 0.035).toFixed(3)})`;
    rows[i].style.opacity = Math.max(0.12, 1 - ad * 0.14).toFixed(2);
  }
  const idx = Math.max(0, Math.min(rows.length - 1, Math.round(center)));
  if (idx !== sel) select(idx);
}

function select(idx) {
  if (rows[sel]) rows[sel].classList.remove('sel');
  sel = idx;
  rows[sel].classList.add('sel');
  renderSection(sel);
}

function scrollToIdx(idx, smooth = true) {
  wheel.scrollTo({ top: idx * rowH, behavior: smooth && !reduceMotion ? 'smooth' : 'auto' });
}

let ticking = false;
wheel.addEventListener('scroll', () => {
  if (!ticking) { ticking = true; requestAnimationFrame(() => { paint(); ticking = false; }); }
});
wheel.addEventListener('click', e => {
  const r = e.target.closest('.row');
  if (r) scrollToIdx(+r.dataset.i);
});
addEventListener('resize', () => { paint(); if (sel >= 0) renderSection(sel); });

// ---------- search ----------
function run(smooth = true) {
  const raw = q.value.trim();
  statusEl.classList.remove('err');
  if (!raw) { statusEl.textContent = ''; return; }
  const best = findClosest(raw);
  if (!best) {
    statusEl.classList.add('err');
    statusEl.textContent = `No size matches "${raw}". Try a form like W310x28, HSS102x102x6.4 or L4x4x1/2.`;
    return;
  }
  const r = DATA[best.idx];
  const hit = best.sys === 'metric' ? r[1] : r[2];
  const exact = normalize(raw) === normalize(hit);
  statusEl.innerHTML = exact
    ? `Exact match: <b>${r[1]}</b> = <b>${r[2] || '—'}</b>`
    : `Closest to <b>${normalize(raw)}</b>: <b>${r[1]}</b> = <b>${r[2] || '—'}</b>`;
  scrollToIdx(best.idx, smooth);
}

document.getElementById('f').addEventListener('submit', e => { e.preventDefault(); run(); q.select(); });
q.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    scrollToIdx(Math.max(0, Math.min(rows.length - 1, sel + (e.key === 'ArrowDown' ? 1 : -1))));
  }
});

const unitButtons = document.querySelectorAll('.units button');
function setUnits(u) {
  units = u;
  unitButtons.forEach(b => b.setAttribute('aria-pressed', String(b.dataset.u === u)));
  try { localStorage.setItem('units', u); } catch (e) {}
  if (sel >= 0) renderSection(sel);
}
unitButtons.forEach(b => b.addEventListener('click', () => setUnits(b.dataset.u)));
try { if (localStorage.getItem('units') === 'mm') setUnits('mm'); } catch (e) {}

const bananaToggle = document.getElementById('banana');
try { bananaToggle.checked = showBanana = localStorage.getItem('banana') === '1'; } catch (e) {}
bananaToggle.addEventListener('change', () => {
  showBanana = bananaToggle.checked;
  try { localStorage.setItem('banana', showBanana ? '1' : '0'); } catch (e) {}
  if (sel >= 0) renderSection(sel);
});

build();
run(false);
paint();
</script>
</body>
