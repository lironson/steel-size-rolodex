<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Steel Size Rolodex</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #e9ecef;
  --panel: #f7f8f9;
  --ink: #18212b;
  --muted: #5b6875;
  --line: #c9d0d7;
  --accent: #e3a400;
  --accent-ink: #1a1400;
  --band: rgba(227, 164, 0, 0.14);
  --err: #b3261e;
  --row-h: 52px;
  --f-display: "Barlow Condensed", "Arial Narrow", Arial, sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12171d; --panel: #1a2129; --ink: #e4e9ee; --muted: #8e9aa6;
    --line: #2d3742; --accent: #f2b824; --accent-ink: #1a1400;
    --band: rgba(242, 184, 36, 0.12); --err: #ff8a80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12171d; --panel: #1a2129; --ink: #e4e9ee; --muted: #8e9aa6;
  --line: #2d3742; --accent: #f2b824; --accent-ink: #1a1400;
  --band: rgba(242, 184, 36, 0.12); --err: #ff8a80;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.4 var(--f-body);
  padding-inline: 16px;
}
.app {
  height: 100%;
  max-width: 640px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding-block: 18px;
}
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 {
  font: 700 26px/1 var(--f-display);
  letter-spacing: 0.02em;
  text-transform: uppercase;
  margin: 0;
}
h1 span { color: var(--accent); }
.count { font: 500 12px var(--f-mono); color: var(--muted); }

form { display: flex; gap: 8px; }
#q {
  flex: 1; min-width: 0;
  font: 600 22px var(--f-mono);
  text-transform: uppercase;
  padding: 10px 14px;
  border: 2px solid var(--line);
  border-radius: 6px;
  background: var(--panel);
  color: var(--ink);
}
#q:focus { outline: none; border-color: var(--accent); }
button {
  font: 700 16px var(--f-display);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 0 18px;
  border: 0; border-radius: 6px;
  background: var(--accent); color: var(--accent-ink);
  cursor: pointer;
}
button:focus-visible, .row:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

#status { min-height: 20px; font: 500 14px var(--f-body); color: var(--muted); }
#status b { font-family: var(--f-mono); color: var(--ink); font-weight: 600; }
#status.err { color: var(--err); }

.cols, .row {
  display: grid;
  grid-template-columns: 58px 1fr 1fr;
  align-items: center;
  gap: 10px;
  padding-inline: 14px;
}
.cols {
  font: 600 13px var(--f-display);
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
}

.wheel-wrap {
  position: relative;
  flex: 1;
  min-height: 300px;
  border-radius: 8px;
  background: var(--panel);
  border: 1px solid var(--line);
  overflow: hidden;
}
.band {
  position: absolute; left: 0; right: 0;
  top: calc(50% - var(--row-h) / 2);
  height: var(--row-h);
  background: var(--band);
  border-block: 2px solid var(--accent);
  pointer-events: none;
}
.wheel-wrap::before, .wheel-wrap::after {
  content: ""; position: absolute; left: 0; right: 0; height: 28%;
  pointer-events: none; z-index: 2;
}
.wheel-wrap::before { top: 0; background: linear-gradient(var(--panel), transparent); }
.wheel-wrap::after { bottom: 0; background: linear-gradient(transparent, var(--panel)); }
#wheel {
  position: absolute; inset: 0;
  overflow-y: auto;
  scroll-snap-type: y mandatory;
  perspective: 700px;
  scrollbar-width: none;
}
#wheel::-webkit-scrollbar { display: none; }
.pad { height: calc(50% - var(--row-h) / 2); }
.row {
  height: var(--row-h);
  scroll-snap-align: center;
  cursor: pointer;
  transform-origin: center;
  will-change: transform, opacity;
  font-variant-numeric: tabular-nums;
}
.t {
  font: 600 12px var(--f-mono);
  color: var(--muted);
  border: 1px solid var(--line);
  border-radius: 4px;
  text-align: center;
  padding: 2px 0;
}
.m, .i { font: 500 18px var(--f-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.i { color: var(--muted); }
.row.sel .m, .row.sel .i { color: var(--ink); font-weight: 600; }
.row.sel .t { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.detail {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
}
.detail div { background: var(--panel); padding: 8px 12px; }
.detail dt {
  font: 600 11px var(--f-display);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
}
.detail dd { margin: 2px 0 0; font: 500 16px var(--f-mono); font-variant-numeric: tabular-nums; }
.hint { font-size: 12px; color: var(--muted); text-align: center; margin: 0; }
kbd { font: 500 11px var(--f-mono); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; }

@media (max-width: 480px) {
  .detail { grid-template-columns: repeat(2, 1fr); }
  .m, .i { font-size: 16px; }
  .cols, .row { grid-template-columns: 46px 1fr 1fr; padding-inline: 10px; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Steel Size <span>Rolodex</span></h1>

  <div id="status" role="status"></div>

const wheel = document.getElementById('wheel');
const q = document.getElementById('q');
const statusEl = document.getElementById('status');
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
let rowH = 52, sel = -1, rows = [];

document.getElementById('count').textContent = DATA.length + ' sizes';

// ---------- parsing ----------
const TYPES = ['PIPE', 'HSS', 'WT', 'MC', 'HP', 'W', 'M', 'S', 'C', 'L'];

function toNum(s) {
  // handles 12.7, 3/4, 1-3/8
  let m = s.match(/^(\d+)-(\d+)\/(\d+)$/);
  if (m) return +m[1] + m[2] / m[3];
  m = s.match(/^(\d*\.?\d+)\/(\d+)$/);
  if (m) return m[1] / m[2];
  const n = parseFloat(s);
  return isNaN(n) ? null : n;
}

function normalize(s) {
  return s.toUpperCase().trim()
    .replace(/\s*[X×*]\s*/g, 'X')
    .replace(/(\d)\s+(?=\d)/g, '$1X')
    .replace(/\s+/g, '');
}

// "W310X28" -> {type:'W', nums:[310,28], sched:''}
function parse(label) {
  const s = normalize(label);
  const type = TYPES.find(t => s.startsWith(t)) || '';
  let rest = s.slice(type.length);
  let sched = '';
  if (type === 'PIPE') {
    const m = rest.match(/^([\d.\/-]+)(.*)$/);
    if (!m) return { type, nums: [], sched: rest };
    rest = m[1]; sched = m[2];
  }
  const nums = rest.split('X').filter(Boolean).map(toNum);
  if (nums.some(n => n === null)) return null;
  return { type, nums, sched };
}

const PARSED = DATA.map(r => ({ m: parse(r[1]), i: r[2] ? parse(r[2]) : null }));

function score(a, b) {
  if (!b || b.nums.length < a.nums.length) return Infinity;
  if (a.type && a.type !== b.type) return Infinity;
  let s = 0;
  a.nums.forEach((v, k) => {
    const w = b.nums[k];
    s += (k === 0 ? 3 : 1) * Math.abs(v - w) / Math.max(Math.abs(v), Math.abs(w), 1e-9);
  });
  if (b.nums.length !== a.nums.length) s += 0.001;       // prefer full-length matches
  if (a.sched && a.sched !== b.sched) s += 0.5;           // pipe schedule mismatch
  return s;
}

function findClosest(input) {
  const a = parse(input);
  if (!a || !a.nums.length) return null;
  let best = { idx: -1, s: Infinity, sys: '' };
  PARSED.forEach((p, idx) => {
    const sm = score(a, p.m), si = score(a, p.i);
    if (sm < best.s) best = { idx, s: sm, sys: 'metric' };
    if (si < best.s) best = { idx, s: si, sys: 'imperial' };
  });
  return best.idx < 0 ? null : best;
}

// ---------- wheel ----------
function build() {
  const frag = document.createDocumentFragment();
  const top = document.createElement('div'); top.className = 'pad';
  frag.appendChild(top);
  DATA.forEach((r, i) => {
    const el = document.createElement('div');
    el.className = 'row';
    el.dataset.i = i;
    el.innerHTML = `<span class="t">${r[0]}</span><span class="m">${r[1]}</span><span class="i">${r[2] || '—'}</span>`;
    frag.appendChild(el);
  });
  const bot = document.createElement('div'); bot.className = 'pad';
  frag.appendChild(bot);
  wheel.appendChild(frag);
  rows = [...wheel.querySelectorAll('.row')];
  rowH = rows[0].offsetHeight;
}

function paint() {
  const st = wheel.scrollTop, h = wheel.clientHeight;
  const first = Math.max(0, Math.floor((st - h / 2) / rowH) - 2);
  const last = Math.min(rows.length - 1, Math.ceil((st + h / 2) / rowH) + 2);
  const center = st / rowH;
  for (let i = first; i <= last; i++) {
    const d = i - center;
    const ad = Math.min(Math.abs(d), 7);
    rows[i].style.transform = `rotateX(${(-d * 11).toFixed(1)}deg) scale(${(1 - ad * 0.035).toFixed(3)})`;
    rows[i].style.opacity = Math.max(0.12, 1 - ad * 0.14).toFixed(2);
  }
  const idx = Math.max(0, Math.min(rows.length - 1, Math.round(center)));
  if (idx !== sel) select(idx);
}

function select(idx) {
  if (rows[sel]) rows[sel].classList.remove('sel');
  sel = idx;
  rows[sel].classList.add('sel');
  const [, , , kgm, pmm] = DATA[sel];
  const fmt = (n, d) => n == null ? '–' : n.toLocaleString(undefined, { maximumFractionDigits: d });
  document.getElementById('d-kgm').textContent = fmt(kgm, 2) + ' kg/m';
  document.getElementById('d-lbft').textContent = fmt(kgm * 0.671969, 2) + ' lb/ft';
  document.getElementById('d-pmm').textContent = fmt(pmm, 0) + ' mm';
  document.getElementById('d-pin').textContent = fmt(pmm / 25.4, 2) + ' in';
}

function scrollToIdx(idx, smooth = true) {
  wheel.scrollTo({ top: idx * rowH, behavior: smooth && !reduceMotion ? 'smooth' : 'auto' });
}

let ticking = false;
wheel.addEventListener('scroll', () => {
  if (!ticking) { ticking = true; requestAnimationFrame(() => { paint(); ticking = false; }); }
});
wheel.addEventListener('click', e => {
  const r = e.target.closest('.row');
  if (r) scrollToIdx(+r.dataset.i);
});
addEventListener('resize', paint);

// ---------- search ----------
function run(smooth = true) {
  const raw = q.value.trim();
  statusEl.classList.remove('err');
  if (!raw) { statusEl.textContent = ''; return; }
  const best = findClosest(raw);
  if (!best) {
    statusEl.classList.add('err');
    statusEl.textContent = `No size matches "${raw}". Try a form like W310x28, HSS102x102x6.4 or L4x4x1/2.`;
    return;
  }
  const r = DATA[best.idx];
  const hit = best.sys === 'metric' ? r[1] : r[2];
  const exact = normalize(raw) === normalize(hit);
  statusEl.innerHTML = exact
    ? `Exact match: <b>${r[1]}</b> = <b>${r[2] || '—'}</b>`
    : `Closest to <b>${normalize(raw)}</b>: <b>${r[1]}</b> = <b>${r[2] || '—'}</b>`;
  scrollToIdx(best.idx, smooth);
}

document.getElementById('f').addEventListener('submit', e => { e.preventDefault(); run(); q.select(); });
q.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    scrollToIdx(Math.max(0, Math.min(rows.length - 1, sel + (e.key === 'ArrowDown' ? 1 : -1))));
  }
});

build();
run(false);
paint();
</script>
</body>
</html>
